    <script>
      window.__OVA__ = {"version":1,"elements":[{"id":"be4cf6ae-3b18-4483-bed0-69e3ce71015c","createdAt":1,"type":"text","text":"Este recurso te acompaña en tu primer contacto con el **modelado 3D**. Partirás de un objetivo concreto: crear y editar un cubo en **Blender**, un programa gratuito y de código abierto, y entender qué lo forma por dentro. No necesitas experiencia previa.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"37e6f6f1-d3a4-4778-abce-79ab0e7a08e9","createdAt":1793244215696,"type":"text","text":"Conoce nuestro OVA: De cero a 3D","role":"heading","textSize":"2xl","textWeight":"bold","textAlign":"left","textColor":"#0f172a"},{"id":"8cd6e8bd-fe92-4ab9-8dd3-334ebcb886ee","createdAt":1793244201955,"type":"video","provider":"youtube","videoId":"n0LELl-F-Zc","url":"","autoplay":false,"loop":false,"controls":true,"muted":false,"start":0,"end":0,"width":0,"height":0},{"id":"9597f9f7-e530-4ce8-841f-627712f58d65","createdAt":1793244246361,"type":"podcast","url":"media/21e19b6d-a694-4c89-a94b-f99f2be2581e.mp3","title":"Escucha y descubre el modelado 3D","series":"","guest":"","description":"","cover":"","transcript":[],"source":"","sourceName":""},{"id":"b1d5de0c-1c8e-4c31-b49a-ad6e21b66b85","createdAt":1793245116309,"type":"section","title":"1.1¿Qué es el Modelado 3D? y sus aplicaciones en la Industria\nDigital.","summary":"","numbered":false,"cover":""},{"id":"0471bf61-39c0-421d-b382-3d2e9c1a46c2","createdAt":3,"type":"text","text":"El **modelado 3D** consiste en crear objetos con largo, ancho y profundidad dentro de un computador. Se usa en:\n- Cine y animación, para personajes y escenarios.\n- Videojuegos, para mundos y objetos.\n- Arquitectura e ingeniería, para visualizar un proyecto antes de construirlo.\n- Impresión 3D y medicina, para piezas físicas y modelos de órganos.\nAl terminar, tendrás un cubo que habrás movido, rotado, escalado y editado tú mismo.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"7f50db1a-8c81-4b05-9deb-1a4b78eba097","createdAt":4,"type":"image","url":"https://images.pexels.com/photos/31137405/pexels-photo-31137405.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940","alt":"impresora 3D fabricando una pieza de plástico sobre su base","fit":"cover","width":3000,"height":2001,"credit":"Jakub Zerdzicki","creditUrl":"https://www.pexels.com/@jakubzerdzicki"},{"id":"91f9242b-dd1f-4ca7-b4d1-8df935582030","createdAt":5,"type":"video","provider":"youtube","videoId":"HliwF-iTTWo","url":"","autoplay":false,"loop":false,"controls":true,"muted":false,"start":0,"end":0,"width":0,"height":0},{"id":"bc442f9b-6d80-47ec-aadf-c3b7b2df88ad","createdAt":6,"type":"callout","variant":"media","title":"","body":"Mira el video para ver cómo luce Blender al abrirlo. Fíjate en el cubo gris del centro: será tu primer objeto de trabajo."},{"id":"26d02277-1ab1-4a63-823d-89d58023fcde","createdAt":7,"type":"matching-pairs","title":"Aplicaciones del modelado 3D","instructions":"Une cada campo con un uso del modelado 3D.","pairs":[{"id":"09c0c2e0-3d27-4e2e-82dd-d9e8d47cfc57","left":"Animación","leftImage":"","right":"Personajes y escenarios","rightImage":""},{"id":"cb2afda7-f110-4c76-8305-b8ff27d8d0b1","left":"Videojuegos","leftImage":"","right":"Mundos y objetos interactivos","rightImage":""},{"id":"13764e9c-5237-4213-b872-ae03cf967ea1","left":"Arquitectura","leftImage":"","right":"Maquetas virtuales de edificios","rightImage":""},{"id":"853e799c-f7cf-4323-9ae0-f094066fe08b","left":"Impresión 3D","leftImage":"","right":"Piezas físicas a partir de un modelo","rightImage":""},{"id":"88578dc9-c958-4ed3-841c-f4d95a6cc2d3","left":"Medicina","leftImage":"","right":"Modelos de órganos para estudio","rightImage":""}],"shuffle":true,"accent":"","passingScore":60},{"id":"e8d0343d-6de1-4106-901d-aecd5ebf3385","createdAt":8,"type":"section","title":"1.2 Los ejes X, Y y Z","summary":"Aprenderás cómo tres números ubican cualquier punto en el espacio.","numbered":true,"cover":""},{"id":"6a1ae8b1-37e9-4277-b58b-1aa4fdbada2a","createdAt":9,"type":"text","text":"Todo objeto 3D se ubica con tres números $(x, y, z)$, uno por cada eje. Los ejes se cruzan en el **origen**, el punto $(0, 0, 0)$. En Blender, el eje $X$ (rojo) va hacia la derecha, el eje $Y$ (verde) hacia el fondo y el eje $Z$ (azul) hacia arriba.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"c072e903-e374-40f0-9222-8eb6909ba05a","createdAt":10,"type":"flip-card","cards":[{"front":{"title":"Eje X","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Dirección horizontal, de izquierda a derecha. Se muestra en rojo.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Eje Y","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Profundidad, hacia adelante y hacia atrás. Se muestra en verde.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Eje Z","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Altura, hacia arriba y hacia abajo. Se muestra en azul.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Origen","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Punto (0, 0, 0) donde se cruzan los tres ejes; el cubo inicial de Blender está centrado ahí.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}}],"flow":"horizontal","trigger":"click","axis":"y","height":240},{"id":"ae206579-7cd9-4aa5-8aa4-201d797e509d","createdAt":11,"type":"reveal","title":"Piensa y revela","prompt":"Un punto tiene coordenadas $(0, 0, 2)$. ¿Dónde se encuentra respecto al origen?","answer":"Está justo encima del origen, a 2 unidades sobre el eje $Z$, porque $x$ y $y$ valen cero y no hay desplazamiento horizontal ni de profundidad.","askForResponse":true,"accent":""},{"id":"53eaf776-9499-455d-aa38-3e3d0bdda5cf","createdAt":12,"type":"section","title":"1.3 Paneles principales de Blender","summary":"Reconocerás las áreas básicas de la interfaz y la función de cada una.","numbered":true,"cover":""},{"id":"fad3d2e8-3c95-40e7-a4fd-0f2fdcad06fc","createdAt":13,"type":"text","text":"Al abrir Blender verás varias áreas. No necesitas dominarlas todas: basta con reconocer los paneles principales y su función básica. Mantén el cursor sobre el **Visor 3D** para que los atajos de teclado funcionen.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"e6a654e2-42f9-44bd-bd39-4665be6d1073","createdAt":14,"type":"table","title":"Paneles principales de la interfaz","body":"Distribución del espacio de trabajo General en Blender.","header":["Panel","Dónde está","Para qué sirve"],"rows":[["Visor 3D","Centro","Ver y editar los objetos"],["Barra de herramientas","Izquierda del visor","Elegir herramientas como mover o rotar"],["Outliner","Arriba a la derecha","Listar los objetos de la escena"],["Propiedades","Abajo a la derecha","Ajustar opciones del objeto y la escena"],["Línea de tiempo","Abajo","Controlar la animación por fotogramas"],["Barra superior","Arriba","Abrir menús y cambiar de modo"]],"rowHeaders":true,"chartKind":"none","chartPlacement":"below"},{"id":"b37ecf72-cff2-4db6-8f99-0789cd8220d4","createdAt":15,"type":"section","title":"1.4 Crear y transformar un cubo","summary":"Construirás tu primer resultado funcional: un cubo que se mueve, rota y cambia de tamaño.","numbered":true,"cover":""},{"id":"c7bc631c-9ee9-415b-95ab-1021ab8175b6","createdAt":16,"type":"steps","title":"Ejercicio guiado: tu primer cubo","items":[{"id":"a821a56e-673b-4156-bde2-126a3726624f","title":"Abre Blender y ubica el cubo","body":"Al iniciar un proyecto General aparece un cubo gris en el origen. Haz clic sobre él para seleccionarlo: verás un contorno naranja."},{"id":"b2af4142-3799-4eac-abe6-5941972d6723","title":"Muévelo sobre el eje X","body":"Con el cursor sobre el visor, pulsa G, luego X, escribe 2 y presiona Enter. El cubo se desplaza 2 unidades hacia la derecha."},{"id":"7a22605e-15e7-4ea9-a613-8b8db5dc0411","title":"Rótalo 45 grados","body":"Pulsa R, luego Z, escribe 45 y presiona Enter. El cubo gira sobre su eje vertical."},{"id":"df722891-9403-45f4-bb30-c50575ade3a5","title":"Cambia su tamaño","body":"Pulsa S, escribe 1.5 y presiona Enter. El cubo aumenta su tamaño una vez y media en todas las direcciones."},{"id":"d7e1aa04-051c-42f5-8a50-0434553876d1","title":"Añade un segundo cubo","body":"Pulsa Shift+A, elige Mesh y luego Cube (Malla > Cubo). El nuevo cubo aparece en el origen, donde está el cursor 3D."},{"id":"979e719f-24c6-475f-bed7-4284b63e61dd","title":"Deshaz si te equivocas","body":"Ctrl+Z revierte la última acción, así puedes experimentar sin miedo a dañar tu trabajo."}],"accent":""},{"id":"2915ffd1-7971-4d3a-820a-acc847db61eb","createdAt":17,"type":"code","code":"import bpy\n\n# Crea un cubo de 2 m de lado, desplazado 3 unidades en X\nbpy.ops.mesh.primitive_cube_add(size=2, location=(3, 0, 0))","language":"python","filename":"cubo.py","showLineNumbers":true},{"id":"0157004c-9849-409f-a50e-56662e22728f","createdAt":18,"type":"quiz","title":"Verifica: ¿dónde queda el cubo?","questions":[{"id":"9677e2f3-64f8-412e-8859-1ce1a79ae9a7","kind":"choice","prompt":"Un cubo está en el origen. Con él seleccionado pulsas G, X, escribes 2 y presionas Enter. ¿Dónde queda su centro?","mode":"single","options":[{"id":"5ed9152c-ba9d-4c19-a4d0-1d5d340f4181","text":"(2, 0, 0)","correct":true,"feedback":"Correcto: G inicia el movimiento, X lo limita al eje horizontal y 2 indica la distancia, así que el centro queda en 2 sobre X."},{"id":"1484aa2b-89c9-425a-9c42-a20b1a63c22f","text":"(0, 2, 0)","correct":false,"feedback":"Ese valor pertenece al eje Y, la profundidad; la tecla pulsada fue X, que fija el movimiento en el eje horizontal."},{"id":"d32ad2ad-fe17-48da-bee8-4438114f845b","text":"(0, 0, 2)","correct":false,"feedback":"Ese valor pertenece al eje Z, la altura; mover hacia arriba exigiría pulsar Z y no X después de G."},{"id":"71e299c4-4c4d-4ae2-8ebb-5ad96b215797","text":"(2, 2, 2)","correct":false,"feedback":"Mover no cambia el tamaño ni desplaza en los tres ejes a la vez; la limitación X afecta un solo eje."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: G más una letra de eje y un número mueve el objeto solo en ese eje."}],"display":"all","accent":"","revealAnswers":false,"shuffleQuestions":false,"shuffleOptions":true,"passingScore":60},{"id":"58f89039-5e8f-4968-839f-a76b8e6a1878","createdAt":19,"type":"section","title":"1.5 Vértices, aristas, caras y mallas","summary":"Descubrirás de qué está hecho el cubo por dentro y lo editarás pieza por pieza.","numbered":true,"cover":""},{"id":"c26fbe5c-8e9c-46aa-a814-9c87b6f71884","createdAt":20,"type":"text","text":"Un objeto 3D es una **malla**: una red de puntos unidos por líneas que forman superficies. Un cubo tiene 8 **vértices** (puntos), 12 **aristas** (segmentos entre dos vértices) y 6 **caras** (superficies planas). Para el cubo se cumple además la relación de Euler, que verás a continuación.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"a0e3303b-ac44-4ff6-81f4-04de1a7bf591","createdAt":21,"type":"flip-card","cards":[{"front":{"title":"Vértice","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Punto en el espacio definido por sus coordenadas (x, y, z).","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Arista","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Segmento de recta que une dos vértices.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Cara","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Superficie plana limitada por tres o más aristas.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Malla","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Conjunto de vértices, aristas y caras que forma la superficie de un objeto.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}}],"flow":"horizontal","trigger":"click","axis":"y","height":240},{"id":"3d21c020-2d1c-4ac1-ab1d-6fa06411ca02","createdAt":22,"type":"math","expression":"V - E + F = 8 - 12 + 6 = 2","displayMode":true,"allowResolve":false},{"id":"96970c77-466f-4a43-9361-3702bddd5309","createdAt":23,"type":"callout","variant":"info","title":"Modos de selección","body":"En modo edición (tecla Tab), pulsa 1 para vértices, 2 para aristas y 3 para caras. Si mueves algo sin revisar el modo, puedes alterar más de lo que querías."},{"id":"6ca96846-3eef-4f37-9de7-abc16e1d2958","createdAt":24,"type":"steps","title":"Ejercicio guiado: edita la malla del cubo","items":[{"id":"45c69347-9d14-41c7-81c5-0da0e8f66e46","title":"Entra en modo edición","body":"Con el cubo seleccionado y el cursor sobre el visor, pulsa Tab. Verás los vértices, aristas y caras del cubo."},{"id":"afde59e4-8f5b-46d9-af6d-1437702a7248","title":"Selecciona un vértice","body":"Pulsa 1 y haz clic sobre una esquina del cubo. El punto se resalta en naranja."},{"id":"fb0a811e-029c-48d5-95bf-1f26d10af981","title":"Muévelo hacia arriba","body":"Pulsa G, luego Z, escribe 1 y presiona Enter. Solo esa esquina sube y las caras vecinas se inclinan."},{"id":"bf0a6ff3-a7b5-4e2f-a4fc-8cf0830634d8","title":"Selecciona una cara","body":"Pulsa 3 y haz clic sobre la cara superior del cubo. Ahora trabajas con una superficie completa."},{"id":"bfa6248c-133c-40c1-a66a-2a3e776983e3","title":"Extruye la cara","body":"Pulsa E, escribe 1 y presiona Enter. Se crean nuevos vértices, aristas y caras que prolongan la malla."},{"id":"a647d672-8d26-4d71-b878-40883d138c67","title":"Vuelve al modo objeto","body":"Pulsa Tab de nuevo. Ya puedes mover o rotar el objeto completo otra vez."}],"accent":""},{"id":"410be02b-8ec4-4e2b-be93-2c16c031cf5a","createdAt":25,"type":"true-false","title":"¿Verdadero o falso?","statements":[{"id":"4a2ceb91-2d2b-4163-b897-8d44fcdbf08b","text":"Un cubo tiene 8 vértices.","answer":true,"explanation":"Verdadero: cada esquina del cubo es un vértice y hay ocho esquinas."},{"id":"e6439e7e-9817-4875-8e9c-1a4a1be471bf","text":"Una arista une tres vértices.","answer":false,"explanation":"Falso: una arista es un segmento que une exactamente dos vértices."},{"id":"930b5b87-7296-4d4d-95c7-4591df0a2b54","text":"Una malla es un conjunto de vértices, aristas y caras.","answer":true,"explanation":"Verdadero: esos tres elementos juntos forman la superficie del objeto."},{"id":"2c74bed1-aa12-4381-97a6-75acb3f49345","text":"Un cubo tiene 8 caras.","answer":false,"explanation":"Falso: tiene 6 caras; el número 8 corresponde a sus vértices."}],"revealAnswers":true,"accent":"","passingScore":60},{"id":"17235e57-902e-480e-8986-858b092d9bd7","createdAt":26,"type":"section","title":"Errores comunes y variaciones","summary":"Aprenderás a corregir fallos frecuentes y extenderás lo construido.","numbered":true,"cover":""},{"id":"ce74a30e-5ad5-4c5a-9d71-7f10c6353a1a","createdAt":27,"type":"accordion","title":"Errores comunes y cómo depurarlos","items":[{"id":"58fe0ece-f15c-4033-8b6b-738bc9b63e01","title":"No veo mi cubo en pantalla","body":"Pulsa Inicio (Home) con el cursor en el visor para encuadrar todos los objetos. Si lo alejaste por error, Ctrl+Z lo devuelve."},{"id":"0a2c0540-b443-4a50-89ce-fb748b5adeaa","title":"Pulso G y no pasa nada","body":"El cursor debe estar sobre el Visor 3D y el objeto debe tener contorno naranja. Los atajos actúan solo sobre el panel bajo el cursor."},{"id":"323ac1d6-e16f-495a-9edc-18e24658a797","title":"Mi cubo se deformó al moverlo","body":"Probablemente estabas en modo edición y moviste vértices. Pulsa Ctrl+Z o Tab para volver al modo objeto y reintenta."},{"id":"df512b3b-f6d7-448d-b7a8-0f53f00fbb36","title":"El cubo se fue muy lejos","body":"Revisa la letra del eje y el número antes de presionar Enter. Con Esc cancelas la transformación sin aplicarla."}],"exclusive":true,"accent":""},{"id":"823f574e-3b61-4140-bf42-4170ae492612","createdAt":28,"type":"open-response","title":"Extiende lo construido","prompt":"¿Cómo modelarías un estante de una tienda de barrio en Cúcuta usando solo cubos? Describe los pasos y las transformaciones que usarías.","sample":"Una buena respuesta propone varios cubos, usa S para volverlos tablas delgadas y G para ubicarlos en alto, unidos en una estructura.","accent":""},{"id":"85160209-52b8-4658-816f-0d262f936aef","createdAt":29,"type":"checklist","title":"Antes del cuestionario, verifica que…","body":"Puedo explicar qué representa cada eje X, Y y Z\nPuedo nombrar los paneles principales de Blender y su función\nMoví, roté y escalé un cubo siguiendo los pasos\nPuedo distinguir un vértice, una arista y una cara"},{"id":"9417fe6a-591b-4419-bf1f-b2100965bac6","createdAt":30,"type":"quiz","title":"Cuestionario final","questions":[{"id":"16ff12d1-1e26-47d7-b4b4-ceb2cfe90135","kind":"choice","prompt":"Un estudio de arquitectura quiere recorrer virtualmente un edificio antes de construirlo. ¿Qué aplicación del modelado 3D usa?","mode":"single","options":[{"id":"8c907dae-23cb-4330-8b66-8a35a9e7d08f","text":"Visualización arquitectónica","correct":true,"feedback":"Correcto: la visualización arquitectónica crea maquetas virtuales para evaluar un proyecto antes de levantarlo."},{"id":"4161c12a-4d1e-41c3-85f8-e4eb853d74bd","text":"Impresión de piezas físicas","correct":false,"feedback":"La impresión 3D fabrica piezas físicas a partir de un modelo, pero aquí se busca recorrer el diseño en pantalla."},{"id":"e9406bf5-a355-48db-ac45-a694d3864cc7","text":"Animación de personajes","correct":false,"feedback":"La animación de personajes da movimiento a figuras para cine o series, no sirve para revisar un edificio proyectado."},{"id":"318cf990-f8f1-4cd0-8212-cfdc24c0847e","text":"Creación de videojuegos","correct":false,"feedback":"Los videojuegos usan modelos para mundos interactivos, un fin distinto de validar un diseño constructivo."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: el modelado 3D permite visualizar proyectos antes de construirlos."},{"id":"ce4f4456-1c93-4112-ad4a-8ee7688fba3f","kind":"choice","prompt":"Un punto tiene coordenadas (1, 4, 3). ¿Qué indica el valor 4?","mode":"single","options":[{"id":"598a929e-bf10-45e8-9d9e-c65d0be15379","text":"La posición sobre el eje Y","correct":true,"feedback":"Correcto: el segundo número de la terna corresponde siempre al eje Y, la profundidad."},{"id":"d1b40e72-f288-43a1-817c-4450430e8a27","text":"La posición sobre el eje Z","correct":false,"feedback":"El eje Z, la altura, se indica con el tercer número de la terna, que aquí vale 3."},{"id":"52ba2ce4-a769-4002-b736-008af344895c","text":"La posición sobre el eje X","correct":false,"feedback":"El eje X, izquierda-derecha, se indica con el primer número, que aquí vale 1."},{"id":"a848fb4c-89ec-4a12-9bc2-3c6f7a98ec4c","text":"La escala del objeto","correct":false,"feedback":"La escala es una propiedad del objeto y no forma parte de las coordenadas de posición de un punto."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: las coordenadas se leen en el orden x, y, z."},{"id":"531cc0a0-96e5-4946-b073-6a5981345d09","kind":"choice","prompt":"¿Qué panel de Blender muestra la lista de todos los objetos de la escena?","mode":"single","options":[{"id":"3e59addd-7b9a-4cd0-be63-ce820ae37c33","text":"El Outliner","correct":true,"feedback":"Correcto: el Outliner, arriba a la derecha, organiza y lista los objetos que componen la escena."},{"id":"84e69e22-6c01-414d-8e66-1a3356e01d2b","text":"El panel de Propiedades","correct":false,"feedback":"El panel de Propiedades ajusta opciones del objeto seleccionado, pero no muestra el listado completo de la escena."},{"id":"be97762b-0124-4fdd-b699-749f8988b6ce","text":"La línea de tiempo","correct":false,"feedback":"La línea de tiempo controla la animación por fotogramas y no enumera objetos."},{"id":"dd33407c-9507-4021-9db1-50617f8ab2bf","text":"La barra de herramientas","correct":false,"feedback":"La barra de herramientas ofrece herramientas como mover o rotar, no una lista de elementos."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: cada panel tiene una función básica; el Outliner organiza los objetos."},{"id":"6e02210b-c0fc-43a8-b52d-7785f6e700c3","kind":"choice","prompt":"Con un objeto seleccionado pulsas R, Z, 90 y Enter. ¿Qué ocurre?","mode":"single","options":[{"id":"5ba82be9-405a-4e41-a976-ebebf2fcf276","text":"Gira 90 grados sobre el eje Z","correct":true,"feedback":"Correcto: R activa la rotación, Z fija el eje vertical y 90 indica los grados de giro."},{"id":"73cc93e6-9fde-46af-9dd2-95c0731423cf","text":"Se mueve 90 unidades sobre el eje Z","correct":false,"feedback":"Mover se hace con G; R nunca desplaza el objeto, solo lo gira alrededor de un eje."},{"id":"1081fcd6-2e08-4c88-8cfb-eb9cd67a8d2e","text":"Se escala 90 veces su tamaño","correct":false,"feedback":"Escalar se hace con S; el número 90 en una rotación son grados y no un factor de tamaño."},{"id":"7675a239-98cb-44b1-88e6-0959ab269b0e","text":"Gira 90 grados sobre el eje X","correct":false,"feedback":"El eje elegido fue Z; para girar sobre X habría que pulsar X después de R."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: R rota, G mueve y S escala, siempre con eje y valor opcionales."},{"id":"97f431f9-3838-4ec8-80ee-eab0aed5aef1","kind":"choice","prompt":"¿Cuántas aristas tiene un cubo?","mode":"single","options":[{"id":"c240ae59-4a98-4d96-ab3b-3380836c6c3f","text":"12","correct":true,"feedback":"Correcto: cuatro aristas en la base, cuatro en la cara superior y cuatro verticales suman doce."},{"id":"d10f5f09-7972-44e8-899b-1ba79af8cfb9","text":"8","correct":false,"feedback":"Ocho es el número de vértices del cubo, no el de aristas; se confunde el punto con el segmento."},{"id":"dd6e38e9-ac3e-42a4-973c-ea5c801b1973","text":"6","correct":false,"feedback":"Seis es el número de caras del cubo; no corresponde al conteo de segmentos que unen vértices."},{"id":"375b6469-11da-4bbd-b2e2-14c44efb0195","text":"24","correct":false,"feedback":"Veinticuatro resulta de contar cada arista varias veces, una por cada cara que la comparte."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: un cubo tiene 8 vértices, 12 aristas y 6 caras."},{"id":"66572b04-4ebb-4ed9-86e9-30eac392deb0","kind":"choice","prompt":"¿Qué es una malla en modelado 3D?","mode":"single","options":[{"id":"adc80215-4a5f-46a5-b0cd-416471db3d37","text":"Una red de vértices, aristas y caras","correct":true,"feedback":"Correcto: la malla es la red de vértices, aristas y caras que define la superficie del objeto."},{"id":"ce803414-9092-4675-867b-1643c5903ce3","text":"Un panel de la interfaz de Blender","correct":false,"feedback":"Los paneles son áreas de la interfaz, como el visor o el Outliner; no forman la geometría del objeto."},{"id":"c363f2fb-afe5-40d2-9fab-fa63c1906490","text":"El conjunto de los ejes X, Y y Z","correct":false,"feedback":"Los ejes X, Y y Z son el sistema de referencia que ubica puntos, no la superficie del modelo."},{"id":"37e58530-8675-4e92-86c3-45bbff8b128d","text":"Un atajo de teclado para editar","correct":false,"feedback":"Los atajos son combinaciones de teclas para ejecutar acciones, no un componente del objeto."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: toda forma 3D se describe como una malla."},{"id":"ea899fc6-a507-45ea-93d4-732fe5448190","kind":"choice","prompt":"Quieres mover el cubo completo, pero al pulsar G solo se desplaza una esquina. ¿Qué debes revisar?","mode":"single","options":[{"id":"79846627-5828-4896-8436-258183fb9778","text":"Que estás en modo objeto y no en modo edición","correct":true,"feedback":"Correcto: en modo edición G mueve solo los vértices seleccionados; en modo objeto mueve el objeto entero."},{"id":"c9efff9b-6651-4f91-93eb-d689a4286cbd","text":"Que el cursor esté sobre el panel de Propiedades","correct":false,"feedback":"El cursor sobre Propiedades impediría que el atajo funcione, pero no movería una esquina aislada."},{"id":"e2f828dc-3374-4e1f-97f0-4dc50ac911ec","text":"Que el eje elegido sea Z y no X","correct":false,"feedback":"El eje elegido solo define la dirección del movimiento, no qué parte del objeto se desplaza."},{"id":"ff3fa208-d5b3-4f48-8d84-0ea857edb4da","text":"Que la malla tenga más vértices","correct":false,"feedback":"La cantidad de vértices no cambia qué se mueve; lo decide el modo activo y la selección."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: antes de transformar, confirma el modo y la selección activos."},{"id":"a09848ef-c780-46ed-8d72-38a0a4b392f8","kind":"choice","prompt":"Quieres convertir un cubo en un tablón plano para una mesa. ¿Qué combinación de teclas usarías?","mode":"single","options":[{"id":"e932c922-27bd-4459-86f5-1fda08658228","text":"S, Z y 0.2 para escalar la altura","correct":true,"feedback":"Correcto: S, luego Z y 0.2 reducen la altura del cubo y lo vuelven un tablón delgado."},{"id":"4d0b9226-e1a3-4028-898e-58fe4fbaf03b","text":"R y 0.2 para rotar el cubo","correct":false,"feedback":"R solo gira el objeto; un giro cambia su orientación pero conserva sus proporciones."},{"id":"dfeb0881-b7c0-4f8e-95d5-3af65e888363","text":"G, Z y 0.2 para mover el cubo","correct":false,"feedback":"G con Z desplaza el cubo hacia arriba o abajo sin modificar su forma."},{"id":"44722c6b-ab2a-481e-9f05-7bd4c6f2e41b","text":"E y 0.2 para extruir una cara","correct":false,"feedback":"Extruir con E agrega geometría nueva a una cara y alarga el objeto, no lo aplana."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: escalar sobre un solo eje deforma proporciones; mover y rotar no lo hacen."},{"id":"4e1c1a22-60de-4bb9-805b-2c523191c913","kind":"choice","prompt":"En modo edición pulsas 3 y haces clic sobre el cubo. ¿Qué elemento de la malla seleccionaste?","mode":"single","options":[{"id":"08772516-8077-4e5d-a7d0-8550a4c46218","text":"Una cara","correct":true,"feedback":"Correcto: la tecla 3 activa el modo de selección de caras y el clic elige una superficie completa."},{"id":"845e5e18-2363-4266-aadc-aed2a4785244","text":"Un vértice","correct":false,"feedback":"Los vértices se seleccionan con la tecla 1 y son puntos individuales en las esquinas."},{"id":"1903d715-50e8-4f7e-b13c-abe5640ee871","text":"Una arista","correct":false,"feedback":"Las aristas se seleccionan con la tecla 2 y son los segmentos entre dos vértices."},{"id":"350b0867-c3b5-4c1e-bdc1-ccceb79bff00","text":"El objeto completo","correct":false,"feedback":"El objeto completo se selecciona en modo objeto, no en modo edición de malla."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: en edición, 1 selecciona vértices, 2 aristas y 3 caras."}],"display":"stepped","accent":"","revealAnswers":false,"shuffleQuestions":false,"shuffleOptions":true,"passingScore":60}],"settings":{"theme":"neon","mode":"light","background":"","completion":{"rule":"quiz-score","minTimeSeconds":0,"quizPolicy":"all"},"aiPattern":"guided-build","ficha":{"definition":"","introduction":"Este OVA te acerca por primera vez al modelado 3D usando Blender, un programa gratuito. Está dirigido a estudiantes de pregrado sin experiencia previa. Construirás y editarás un cubo siguiendo pasos numerados, y con ello comprenderás los ejes, la interfaz y la estructura de una malla.","competencies":["Navegar la interfaz básica de Blender con criterio.","Modelar formas simples a partir de primitivas.","Diagnosticar y corregir errores comunes de edición 3D."],"topics":["1 Qué es el modelado 3D y qué construirás","Los ejes X, Y y Z","Paneles principales de Blender","Crear y transformar un cubo","Vértices, aristas, caras y mallas","Errores comunes y variaciones"],"references":["Blender Foundation. (2024). Blender Manual: Mesh Structure. https://docs.blender.org/manual/en/latest/modeling/meshes/structure.html","Chopine, A. (2012). 3D Art Essentials: The Assets That Every 3D Artist Needs to Know. Focal Press.","Vaughan, W. (2012). Digital Modeling. New Riders.","Blender Education. Introduction to 3D. https://education.blender.org/concepts/general/introduction-3D/"],"objectives":["Describir el concepto de modelado 3D y sus principales aplicaciones.","Identificar los ejes X, Y y Z y los paneles principales de la interfaz de Blender.","Aplicar transformaciones básicas y reconocer vértices, aristas, caras y mallas al editar un cubo."],"outcomes":["Ubica un punto en el espacio mediante sus coordenadas (x, y, z).","Reconoce la función de cada panel principal de Blender.","Crea, mueve, rota, escala y edita un cubo siguiendo un procedimiento guiado.","Corrige errores frecuentes al transformar objetos y editar mallas."],"methodology":"El OVA utiliza una metodología teórico-práctica e interactiva. Primero, el estudiante conoce los conceptos básicos del modelado 3D mediante explicaciones, imágenes, videos y audios. Después, explora los ejes X, Y y Z, la interfaz de Blender y los elementos de una malla. Finalmente, refuerza lo aprendido mediante actividades interactivas y cuestionarios de evaluación.","authorship":"Natalia Torres Ramón\nRichard Alexander Rueda Cobo\nJohan Sneider Alba Diz","validity":"","duration":""},"showFicha":true,"kind":"ova","showAuthor":false,"showAudience":false}}; window.__OVA_TITLE__ = "De Cero a 3D: Introducción al Modelado Tridimensional"; window.__OVA_HEADER__ = {"title":"De Cero a 3D: Introducción al Modelado Tridimensional","author":"Natalia Torres","cover":"https://images.pexels.com/photos/7504746/pexels-photo-7504746.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940"}; window.__OVA_SHOW_BADGE__ = true; window.__OVA_TOC__ = "custom"; window.__OVA_EXPORT_KIND__ = "scorm";
